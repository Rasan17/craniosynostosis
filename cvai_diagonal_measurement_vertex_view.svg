<svg viewBox="0 0 700 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5 d5" font-family="system-ui, -apple-system, sans-serif" style="">
  <title id="t5" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Vertex view of an infant head with right occipital plagiocephaly showing the two oblique diagonals used to calculate the Cranial Vault Asymmetry Index</title>
  <desc id="d5" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, -apple-system, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A head seen from directly above with anterior at the top, so the patient's right lies on the right of the image. The right occiput is flattened and the right frontal region bosses forward. Two diagonals cross at the centre of the vault, each at thirty degrees to the midline. Diagonal A, the shorter, runs from the anterior left to the flattened posterior right. Diagonal B, the longer, runs from the bossed anterior right to the posterior left. CVAI equals the absolute difference between B and A, divided by A, times one hundred.</desc>

